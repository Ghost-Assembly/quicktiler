# SonarQube Cloud. projectKey and organization must match what Sonar creates
# when the project is imported; adjust them there rather than guessing here.
sonar.projectKey=napalm255_quicktiler
sonar.organization=napalm255

sonar.sources=modules,extension.js,prefs.js
sonar.tests=tests
sonar.exclusions=node_modules/**,coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# prefs.js holds only Adw/Gtk widget construction; every decision it used to
# make lives in modules/shortcuts.js and is unit-tested there. Testing what
# remains would mean asserting against stubs of the toolkit, which tests the
# stubs.
#
# vitest.config.js excludes tests/** as well, but only to keep a dynamically
# imported stub from being counted; nothing under tests/ is in sonar.sources,
# so there is nothing to exclude here.
sonar.coverage.exclusions=prefs.js
